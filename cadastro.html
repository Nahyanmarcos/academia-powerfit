<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | PowerFit Academia</title>

    <link rel="stylesheet" href="css/styler.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <div class="logo">
            <h1>POWER<span>FIT</span></h1>
            <p>ACADEMIA</p>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="login.html">Login</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>

    </header>


    <!-- Área principal -->
    <main class="container">

        <div class="cadastro-box">

            <h2>Cadastro de Aluno</h2>

            <p>
                Crie sua conta e faça parte da PowerFit Academia.
            </p>


            <form id="formCadastro">

                <!-- Nome -->
                <div class="form-group">
                    <label for="nome">Nome completo</label>

                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>


                <!-- CPF e Data de nascimento -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="cpf">CPF</label>

                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>


                    <div class="form-group">
                        <label for="nascimento">Data de nascimento</label>

                        <input type="date" id="nascimento" required>
                    </div>

                </div>


                <!-- E-mail e telefone -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="email">E-mail</label>

                        <input type="email" id="email" placeholder="seuemail@email.com" required>
                    </div>


                    <div class="form-group">
                        <label for="telefone">Telefone</label>

                        <input type="tel" id="telefone" placeholder="(31) 99999-9999" required>
                    </div>

                </div>


                <!-- Endereço -->
                <div class="form-group">
                    <label for="endereco">Endereço</label>

                    <input type="text" id="endereco" placeholder="Digite seu endereço" required>
                </div>


                <!-- Plano -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="plano">Escolha seu plano</label>

                        <select id="plano" required>
                            <option value="">Selecione um plano</option>
                            <option value="mensal">Plano Mensal - R$ 99,90</option>
                            <option value="trimestral">Plano Trimestral - R$ 269,90</option>
                            <option value="anual">Plano Anual - R$ 899,90</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="pagamento">Forma de pagamento</label>

                        <select id="pagamento" required>
                            <option value="">Selecione</option>
                            <option value="pix">PIX</option>
                            <option value="cartao">Cartão</option>
                            <option value="dinheiro">Dinheiro</option>
                        </select>
                    </div>

                </div>


                <!-- Senha -->
                <div class="form-group">
                    <label for="senha">Crie uma senha</label>

                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>


                <!-- Confirmar senha -->
                <div class="form-group">
                    <label for="confirmarSenha">Confirme sua senha</label>

                    <input type="password" id="confirmarSenha" placeholder="Digite novamente sua senha" required>
                </div>


                <!-- Termos -->
                <div class="termos">

                    <input type="checkbox" id="termos" required>

                    <label for="termos">
                        Concordo com os termos de uso da academia.
                    </label>

                </div>


                <!-- Botão -->
                <button type="submit" class="btn-cadastrar">
                    REALIZAR CADASTRO
                </button>


                <!-- Link Login -->
                <p class="login-link">
                    Já possui uma conta?

                    <a href="login.html">
                        Faça login
                    </a>
                </p>

            </form>

        </div>

    </main>


    <!-- Rodapé -->
    <footer>
        <p>© 2026 PowerFit Academia - Todos os direitos reservados.</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
